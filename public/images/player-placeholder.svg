<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Silueta neutra de deportista del C.D. Voleibol San Pedro">
  <defs>
    <linearGradient id="cdvBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="55%" stop-color="#17171b"/>
      <stop offset="100%" stop-color="#0e0e12"/>
    </linearGradient>
    <radialGradient id="cdvCrimsonGlow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#d90429" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#d90429" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0e0e12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cdvJerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="50%" stop-color="#1f1f25"/>
      <stop offset="100%" stop-color="#151519"/>
    </linearGradient>
    <linearGradient id="cdvSilhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34343c"/>
      <stop offset="100%" stop-color="#202026"/>
    </linearGradient>
  </defs>

  <!-- Fondo deportivo neutro -->
  <rect width="400" height="500" fill="url(#cdvBgGrad)"/>
  <rect width="400" height="500" fill="url(#cdvCrimsonGlow)"/>

  <!-- Referencia sutil de red y pista -->
  <g stroke="#2a2a32" stroke-width="1.2" opacity="0.6">
    <line x1="48" y1="0" x2="48" y2="500" stroke-dasharray="4 6"/>
    <line x1="352" y1="0" x2="352" y2="500" stroke-dasharray="4 6"/>
    <line x1="0" y1="336" x2="400" y2="336" stroke="#34343e" stroke-width="1.5"/>
  </g>

  <!-- Silueta neutra de deportista (sin rasgos identificativos) -->
  <g id="neutral-athlete-silhouette">
    <!-- Cabeza y cuello neutros -->
    <path d="M 183 136 L 183 166 C 150 170 124 180 108 192 L 136 204 L 176 184 L 224 184 L 264 204 L 292 192 C 276 180 250 170 217 166 L 217 136 Z"
          fill="url(#cdvSilhouetteGrad)" stroke="#3c3c46" stroke-width="1.2"/>
    <ellipse cx="200" cy="102" rx="31" ry="37" fill="url(#cdvSilhouetteGrad)" stroke="#444450" stroke-width="1.4"/>

    <!-- Brazos en postura neutra -->
    <path d="M 108 192 C 94 206 88 232 88 262 L 94 374 C 95 390 103 402 114 404 C 122 404 127 394 127 378 L 128 258 L 136 204 Z"
          fill="url(#cdvSilhouetteGrad)" stroke="#3a3a44" stroke-width="1.2"/>
    <path d="M 292 192 C 306 206 312 232 312 262 L 306 374 C 305 390 297 402 286 404 C 278 404 273 394 273 378 L 272 258 L 264 204 Z"
          fill="url(#cdvSilhouetteGrad)" stroke="#3a3a44" stroke-width="1.2"/>

    <!-- Piernas y pantalón deportivo -->
    <path d="M 150 404 L 146 500 L 190 500 L 194 404 Z" fill="url(#cdvSilhouetteGrad)" stroke="#32323c" stroke-width="1.2"/>
    <path d="M 210 404 L 214 500 L 254 500 L 250 404 Z" fill="url(#cdvSilhouetteGrad)" stroke="#32323c" stroke-width="1.2"/>
    <path d="M 156 324 L 244 324 L 256 414 L 208 414 L 200 368 L 192 414 L 144 414 Z"
          fill="#141418" stroke="#3c3c46" stroke-width="1.4"/>
    <path d="M 156 324 L 144 414 L 149 414 L 160 324 Z" fill="#d90429" opacity="0.9"/>
    <path d="M 244 324 L 256 414 L 251 414 L 240 324 Z" fill="#d90429" opacity="0.9"/>

    <!-- Camiseta rojinegra del club -->
    <path d="M 124 188 C 120 222 132 262 148 292 L 156 326 L 244 326 L 252 292 C 268 262 280 222 276 188 L 226 182 L 200 206 L 174 182 Z"
          fill="url(#cdvJerseyGrad)" stroke="#464652" stroke-width="1.5"/>
    <path d="M 124 188 C 120 222 132 262 148 292 L 156 326 L 150 326 C 136 292 126 252 130 206 Z" fill="#d90429" opacity="0.9"/>
    <path d="M 276 188 C 280 222 268 262 252 292 L 244 326 L 250 326 C 264 292 274 252 270 206 Z" fill="#d90429" opacity="0.9"/>
    <path d="M 174 182 L 200 208 L 226 182" fill="none" stroke="#d90429" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 176 180 L 200 204 L 224 180" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- Emblema vectorial minimalista del club (balón estilizado) -->
  <g id="club-vector-emblem" transform="translate(200 248)">
    <circle r="24" fill="#18181c" stroke="#d90429" stroke-width="2.4"/>
    <circle r="19" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M -17 -5 C -6 -11 8 -9 17 -2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M -16 6 C -4 1 9 2 18 7" fill="none" stroke="#d90429" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M -2 -18 C -7 -6 -5 9 2 18" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
